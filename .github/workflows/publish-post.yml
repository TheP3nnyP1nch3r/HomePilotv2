name: Publish next journal post

on:
  schedule:
    # Tue / Thu / Sat at 14:00 UTC (early morning US)
    - cron: '0 14 * * 2,4,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish next queued post
        run: node scripts/publish-post.js

      - name: Commit and push
        run: |
          if git diff --quiet -- posts.json queue.json; then
            echo "No changes to commit."
            exit 0
          fi
          SLUG=$(node -e "const p=require('./posts.json');const l=Array.isArray(p)?p:p.posts;console.log(l[0].slug)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json queue.json
          git commit -m "Publish journal post: $SLUG"
          git push
